{% extends 'base.html' %}

{% block title %}Server Error (500) – JobTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle mx-auto p-4 mb-3" style="width: 90px; height: 90px; font-size: 2.5rem;">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h1 class="fw-bold text-dark display-5">500</h1>
            <h4 class="fw-bold text-dark mb-2">Unexpected Server Error</h4>
            <p class="text-muted small mb-4">
                Something went wrong on our end. Please refresh the page or return to your dashboard.
            </p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 rounded-pill shadow-sm">
                <i class="bi bi-arrow-clockwise me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
