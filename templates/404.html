{% extends 'base.html' %}

{% block title %}Page Not Found (404) – JobTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning-emphasis rounded-circle mx-auto p-4 mb-3" style="width: 90px; height: 90px; font-size: 2.5rem;">
                <i class="bi bi-question-circle"></i>
            </div>
            <h1 class="fw-bold text-dark display-5">404</h1>
            <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
            <p class="text-muted small mb-4">
                The page or job application you are looking for does not exist, or you may not have permission to access it.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 rounded-pill shadow-sm">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
                <a href="{% url 'job_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                    View Applications
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
